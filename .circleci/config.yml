version: 2.1
orbs:
  docker: circleci/docker@2.8.0

commands:

  build-chain-test:
    description: |
      Run the real entrypoint (cmd.sh) against a dummy project inside a freshly
      built image and assert a plausible application image comes out.

      A green `docker build` does not prove the image can compile a sketch --
      six defects once shipped green exactly that way, including one where the
      build reported SUCCESS while exporting the 3 kB esp32 partition table as
      firmware.bin. See tests/build-target.sh.
    parameters:
      image:
        type: string
        description: Image (with tag) to test, as just built by docker/build.
      targets:
        type: string
        description: Space-separated targets to exercise, e.g. "esp8266 esp32".
      negative:
        type: boolean
        default: false
        description: |
          Also run the guard-the-guard test, which rebuilds with cflags removed
          and requires the build to FAIL. Without it, the cflags assertions in
          the positive tests could silently stop asserting anything. Needs an
          image carrying the esp8266 core.
    steps:
      - run:
          name: Build-chain test (<< parameters.targets >>)
          no_output_timeout: 30m
          command: |
            for t in << parameters.targets >>; do
              echo "=== build-chain test: $t ==="
              docker run --rm "<< parameters.image >>" "/opt/tests/build-${t}.sh"
            done
      - when:
          condition: << parameters.negative >>
          steps:
            - run:
                name: Negative test (the guards must be able to fail)
                no_output_timeout: 30m
                command: |
                  docker run --rm "<< parameters.image >>" /opt/tests/negative-cflags.sh

# Deploy markers (circleci run release plan/update) make each deploy visible in
# the project Deploys UI with SUCCESS/FAILED status. See:
# https://app.circleci.com/settings/project/github/suculent/arduino-docker-build/deploys

jobs:

  deploy8266:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - checkout
      - run:
          name: Plan a deploy
          command: |
            circleci run release plan \
              --environment-name="production" \
              --component-name="esp8266" \
              --target-version="$CIRCLE_SHA1"
      - docker/check
      # The base image (dhi.io/debian-base) is a Docker Hardened Image. dhi.io
      # refuses anonymous pulls even for publicly entitled repositories, so the
      # builder has to authenticate there as well as to Docker Hub. DHI is gated
      # on Docker Hub accounts, so the same dockerhub-context credentials apply.
      - docker/check:
          registry: dhi.io
      - docker/build:
          image: suculent/arduino-docker-build
          dockerfile: ./Dockerfile.esp8266
          tag: esp8266
      # Verify the exact image about to be published. `test` does not run on
      # this branch, and builds a different Dockerfile anyway.
      - build-chain-test:
          image: suculent/arduino-docker-build:esp8266
          targets: "esp8266"
          negative: true
      - docker/push:
          digest-path: /tmp/digest.txt
          image: suculent/arduino-docker-build
          tag: esp8266
      - run:
          command: |
            echo "Digest is: $(</tmp/digest.txt)"
            docker tag $(</tmp/digest.txt) suculent/arduino-docker-build:esp8266
      - run:
          name: Mark deploy SUCCESS
          command: circleci run release update --status=SUCCESS
          when: on_success
      - run:
          name: Mark deploy FAILED
          command: circleci run release update --status=FAILED
          when: on_fail

  deploy32:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - checkout
      - run:
          name: Plan a deploy
          command: |
            circleci run release plan \
              --environment-name="production" \
              --component-name="esp32" \
              --target-version="$CIRCLE_SHA1"
      - docker/check
      # The base image (dhi.io/debian-base) is a Docker Hardened Image. dhi.io
      # refuses anonymous pulls even for publicly entitled repositories, so the
      # builder has to authenticate there as well as to Docker Hub. DHI is gated
      # on Docker Hub accounts, so the same dockerhub-context credentials apply.
      - docker/check:
          registry: dhi.io
      - docker/build:
          image: suculent/arduino-docker-build
          dockerfile: ./Dockerfile.esp32
          tag: esp32
      # Verify the exact image about to be published. `test` does not run on
      # this branch, and builds a different Dockerfile anyway.
      - build-chain-test:
          image: suculent/arduino-docker-build:esp32
          targets: "esp32"
      - docker/push:
          digest-path: /tmp/digest.txt
          image: suculent/arduino-docker-build
          tag: esp32
      - run:
          command: |
            echo "Digest is: $(</tmp/digest.txt)"
            docker tag $(</tmp/digest.txt) suculent/arduino-docker-build:esp32
      - run:
          name: Mark deploy SUCCESS
          command: circleci run release update --status=SUCCESS
          when: on_success
      - run:
          name: Mark deploy FAILED
          command: circleci run release update --status=FAILED
          when: on_fail

  deployFat:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - checkout
      - run:
          name: Plan a deploy
          command: |
            circleci run release plan \
              --environment-name="production" \
              --component-name="fat" \
              --target-version="$CIRCLE_SHA1"
      - docker/check
      # The base image (dhi.io/debian-base) is a Docker Hardened Image. dhi.io
      # refuses anonymous pulls even for publicly entitled repositories, so the
      # builder has to authenticate there as well as to Docker Hub. DHI is gated
      # on Docker Hub accounts, so the same dockerhub-context credentials apply.
      - docker/check:
          registry: dhi.io
      - docker/build:
          image: suculent/arduino-docker-build
          tag: latest
      # Verify the exact image about to be published. `test` no longer runs on
      # this branch (it would rebuild the same Dockerfile a second time), so
      # this is the gate.
      - build-chain-test:
          image: suculent/arduino-docker-build:latest
          targets: "esp8266 esp32"
          negative: true
      - docker/push:
          digest-path: /tmp/digest.txt
          image: suculent/arduino-docker-build
          tag: latest
      - run:
          command: |
            echo "Digest is: $(</tmp/digest.txt)"
            docker tag $(</tmp/digest.txt) suculent/arduino-docker-build:latest
      - run:
          name: Mark deploy SUCCESS
          command: circleci run release update --status=SUCCESS
          when: on_success
      - run:
          name: Mark deploy FAILED
          command: circleci run release update --status=FAILED
          when: on_fail

  test:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - checkout
      - docker/check
      # The base image (dhi.io/debian-base) is a Docker Hardened Image. dhi.io
      # refuses anonymous pulls even for publicly entitled repositories, so the
      # builder has to authenticate there as well as to Docker Hub. DHI is gated
      # on Docker Hub accounts, so the same dockerhub-context credentials apply.
      - docker/check:
          registry: dhi.io
      - docker/build:
          image: suculent/arduino-docker-build
          tag: future
      - build-chain-test:
          image: suculent/arduino-docker-build:future
          targets: "esp8266 esp32"
          negative: true

#
# WORKFLOWS
#

workflows:

  build:
    jobs:
      # Gate for branches that do not deploy.
      #
      # Each deploy job below builds, build-chain-tests and pushes ONE image, so
      # running `test` alongside them only rebuilt a Dockerfile a second time for
      # no extra coverage: on master the ~6 GB Fat image was built twice per
      # pipeline, and on esp32/esp8266 `test` built the Fat image those branches
      # do not even ship. The deploy jobs no longer `requires: test` for the same
      # reason -- each one now verifies the exact image it is about to push,
      # which is a stronger guarantee than gating on a separately built one.
      - test:
          context:
            - dockerhub
          filters:
            branches:
              ignore:
                - master
                - test
                - esp32
                - esp8266
      - deployFat:
          context:
            - dockerhub
          filters:
            branches:
              only: master, test
      - deploy32:
          context:
            - dockerhub
          filters:
            branches:
              only: esp32
      - deploy8266:
          context:
            - dockerhub
          filters:
            branches:
              only: esp8266
